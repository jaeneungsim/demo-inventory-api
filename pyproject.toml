[project]
name = "demo-inventory-api"
version = "0.1.0"
description = "Inventory API used as the review target of pr-triage"
requires-python = ">=3.13"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "BLE"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q --import-mode=importlib"
